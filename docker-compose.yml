services:
  app:
    build: .
    container_name: go-http-server
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - FILENAME=/app/data/timestamps.log
      - ROUTE=${ROUTE:-/}
      - THRESHOLD=${THRESHOLD:-60}
    volumes:
      # A directory volume, not a file bind mount: the app replaces the file via rename.
      - data:/app/data
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.5"

volumes:
  data:
